set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g status-position top
set -g status-style 'bg=#333333 fg=#ffffff'

# Prominent session name and host display
set -g status-left-length 40
set -g status-left '#[bg=#F07623,fg=#262B44,bold]  #S #[bg=#333333,fg=#F07623]#[bg=#333333,fg=#888888] #h  '

set -g status-right-length 40
set -g status-right '#[fg=#4B95E9]#[bg=#4B95E9,fg=#262B44,bold] %H:%M #[bg=#4B95E9,fg=#59C9A5]#[bg=#59C9A5,fg=#262B44] %b %d '
